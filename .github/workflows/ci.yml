name: ci


on:
  pull_request:
    branches: [main]


jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - name: Run Tests 
        run: go test -cover ./... 
  Style:
    name: Style 
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - name: Install staticcheck for linting
        run: go install honnef.co/go/tools/cmd/staticcheck@latest


      - name: Run Formating checks
        run: test -z $(go fmt ./...) 

      - name: Run Linting checks
        run: test -z $(staticcheck ./...) 
