name: cd

on:
  push:
    branches: [main]

jobs:
  Deploy:
    name: Deploy
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 
        uses: actions/setup-go@v5

      - id: 'auth service account 2'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
  
      - name: Build App 
        run: ./scripts/buildprod.sh

      - name: Build App 
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-485510/notely-ar-repo/notely:latest .

